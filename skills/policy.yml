# policy.yml — the central skill policy.
#
# `common` skills apply to every repo. `projects` lists the skills specific to
# each project, on top of common. Entries are skill names within their scope:
# a common entry `testing` lives at skills/common/testing/, a project entry
# `conventions` under AnimoFrontend lives at skills/AnimoFrontend/conventions/.
#
# Versions are NOT listed here — each skill owns its version in its skill.yml.

common:
  - task-submission
  - testing

projects:
  AnimoFrontend:
    - conventions
  AnimoMobileApp:
    - conventions
  AnimoOrion:
    - conventions
  Velox:
    - conventions
  AnimoNext:
    - conventions
